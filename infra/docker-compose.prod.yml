version: '3.8'

services:
  shareit-backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: shareit_backend_prod
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "${SHAREIT_DATABASE_URL}"
      REDIS_URL: "${SHAREIT_REDIS_URL:-redis://redis:6379/0}"
      S3_ENDPOINT: "${S3_ENDPOINT:-minio:9000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_BUCKET: "${S3_BUCKET:-shareit-media}"
      S3_USE_SSL: "${S3_USE_SSL:-false}"
    networks:
      - nilbyte-prod
      - nilbyte-db

  shareit-worker:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.worker
    container_name: shareit_worker_prod
    restart: unless-stopped
    environment:
      DATABASE_URL: "${SHAREIT_DATABASE_URL}"
      REDIS_URL: "${SHAREIT_REDIS_URL:-redis://redis:6379/0}"
      S3_ENDPOINT: "${S3_ENDPOINT:-minio:9000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_BUCKET: "${S3_BUCKET:-shareit-media}"
      S3_USE_SSL: "${S3_USE_SSL:-false}"
    networks:
      - nilbyte-prod
      - nilbyte-db

  shareit-web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: shareit_web_prod
    restart: unless-stopped
    networks:
      - nilbyte-prod

  shareit-backoffice:
    build:
      context: ../apps/backoffice
      dockerfile: Dockerfile
    container_name: shareit_backoffice_prod
    restart: unless-stopped
    networks:
      - nilbyte-prod

networks:
  nilbyte-prod:
    external: true
    name: nilbyte-prod
  nilbyte-db:
    external: true
    name: nilbyte-db
